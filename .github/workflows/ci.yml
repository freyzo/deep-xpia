name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unused code (pyflakes)
        run: python -m pyflakes src tests
      - name: Tests (simulated mode only; no API key, no live calls)
        run: python -m pytest -q
      - name: Types (mypy ratchet; per-file error counts may only go down)
        run: python scripts/mypy_ratchet.py

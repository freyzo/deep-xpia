services:
  agents:
    build:
      context: .
      dockerfile: Dockerfile.agents
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPXPIA_LIVE=${DEEPXPIA_LIVE:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "3000:80"
    depends_on:
      - agents

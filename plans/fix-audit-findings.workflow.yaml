# deep-xpia audit fix workflow
# shape: skeleton_phases (skeleton registry file absent; shape per /yaml-workflow spec)
# executed via /loop: one item at a time, regression guard after each.

meta:
  name: fix-audit-findings
  created: 2026-10-10
  source: audit conversation (bugs #1-16, dead code, orphan files)
  config_ref: plans/fix-audit-findings.config.yaml
  principle: minimal delta per item; no behavior change beyond the defect; no new bugs

invariants:
  - every item: edit -> py_compile -> pytest -> item-specific probe
  - pytest pass count never drops below baseline
  - committed artifacts (deepxpiabench-v1.jsonl, results/*.md, README numbers) untouched
  - no public symbol removed (orphan modules -> deferred, user decision)

phases:
  - id: P0_baseline
    steps:
      - id: P0.1
        cmd: "${python} -m pip install -q pytest pytest-asyncio"
        note: pytest is a declared dev dep; venv lacks it
      - id: P0.2
        cmd: "${python} -m pytest -q"
        verification: record baseline pass/fail count

  - id: P1_bugs
    steps:
      - id: B01
        file: src/deep_xpia/bench/runner.py
        defect: "random.Random(hash(case.id) ^ run_index) -> per-process randomized"
        fix: "seed = zlib.crc32(case.id.encode()) ^ run_index"
        verification: two separate processes produce identical RunResult for same case
      - id: B02
        file: src/deep_xpia/bench/runner.py
        defect: live LAST_HOP target == len(agents)-1, loop covers agents[:-1] -> never injects
        fix: LAST_HOP -> hop == max_hop - 1 (last executed hop; matches generator inject_hop = hop_count-1)
        keep: MIDDLE_HOP formula unchanged (already matches generator)
        verification: for n_agents 2..5 every position maps to an executed hop
      - id: B03
        file: src/deep_xpia/bench/runner.py
        defect: asr_table/base_asr computed then unused; ASR = 1-TPR
        fix: "attack_succeeded = rng.random() < base_asr (draw order preserved)"
        verification: simulated ASR per defense tracks asr_table
      - id: B03b
        file: src/deep_xpia/bench/runner.py
        defect: depth_penalty negative at depth 1 -> boosts TPR
        fix: "depth_penalty = max(0, case.depth - 2) * 0.05"
      - id: B04_B05
        file: src/deep_xpia/server.py
        defect: [GET / shadows static mount, dashboard path has one .parent too many]
        fix: path = Path(__file__).resolve().parents[2]/dashboard/dist; register fallback GET / only when build absent
        verification: resolved path inside repo; with fake dist dir, "/" route is Mount
      - id: B06
        file: src/deep_xpia/server.py
        defect: stream starts before WS subscribe; task ref not retained
        fix: wait <=5s for a subscriber before streaming; keep tasks in set w/ done-callback discard
        verification: TestClient WS receives first event
      - id: B07
        file: src/deep_xpia/server.py
        defect: LaunderingHopEvent/SessionEvent field names -> empty from_agent/content
        fix: content falls back actual_output -> output_content -> content; from_agent falls back to previous hop agent ("user" first)
        verification: intent_laundering stream events have non-empty content + agents
      - id: B08_B09
        file: src/deep_xpia/adapters/native.py
        defect: [clean 2-agent attack_success=True, "send.*to" substring check, RunResult.case_id=chain_id]
        fix: success requires injected payload; regex search; NativePipeline.case_id from case.id
        verification: clean 2-agent -> False; case_id == case.id; test_retrieve passes
      - id: B10
        file: src/deep_xpia/bench/generator.py
        defect: case.depth != topology.hop_count (50/150); id names fallback topology wrongly
        fix: depth = topology.hop_count; id uses topology.topology_type; severity from real depth
        scope: future generations only; v1 dataset not regenerated
        verification: generate to scratch; 0 mismatches
      - id: B11
        files: [src/deep_xpia/cli.py, src/deep_xpia/bench/runner.py]
        defect: run default dataset v2 missing; unknown --defense silently undefended
        fix: run default -> deepxpiabench-v1.jsonl; _parse_defense raises ValueError on unknown
      - id: B13
        file: src/deep_xpia/bench/metrics.py
        defect: dead loop; per-taxonomy fpr always 0
        fix: remove dead loop + per_tax_fpr; keep "fpr" key = 0.0 w/ comment (schema compat), note in table header that FPR is from clean cases only
      - id: B14
        file: src/deep_xpia/bench/report.py
        defect: coverage matrix omits DXPIA-008
        fix: derive taxonomy_ids from TaxonomyID enum
      - id: B15
        file: src/deep_xpia/defenses/dlp.py
        defect: "[A-Z|a-z]" literal pipe
        fix: "[A-Za-z]"
      - id: B16
        file: src/deep_xpia/defenses/intent_verify.py
        defect: [live parse of fenced JSON fails -> blocked, threshold swap not exception-safe]
        fix: extract first {...} before json.loads; try/finally around threshold swap
        keep: parse-failure fallback policy unchanged (security decision)
      - id: B_ver
        file: src/deep_xpia/__init__.py
        fix: __version__ = "2.0.0" (match pyproject)

  - id: P2_dead_code
    steps:
      - id: D01
        action: remove unused imports (server json/time/ChainEvent, session_smuggling json, context_budget field, native InjectionPosition)
        verification: grep shows no remaining use before removal
      - id: D02
        action: remove unused locals (intent_laundering laundered_drift_1, session_smuggling te_input)
      - id: D03
        action: dashboard - drop DDA_DATA.none; heatmap highlight 006 -> 008 to match copy; remove orphan "Alignment" footnote
        verification: npm build not required (docs/ not rebuilt); JSX syntax check via esbuild if available

  - id: P3_orphan_files
    steps:
      - id: F01
        cmd: git rm dashboard/vite.config.js.timestamp-*.mjs
        plus: add "vite.config.js.timestamp-*" to .gitignore
      - id: F02
        cmd: git rm docs/assets/index-BmG5pDjZ.js docs/assets/index-DzHHaUEI.js
        verification: docs/index.html still references index-BXrj0YH9.js only

  - id: P4_final
    steps:
      - id: Z1
        cmd: "${python} -m pytest -q"
        verification: ">= baseline"
      - id: Z2
        cmd: git diff --stat
        action: report per-item outcome; no commit unless asked

deferred:   # needs user decision; not touched
  - "#12 v1 dataset has 250 cases / 0 DXPIA-008 vs README 300: regenerate or fix README?"
  - live mode never calls executor agent (changes attack_success semantics + cost)
  - orphan modules: report.py (no callers), adapters/ (runner ignores --target), events.py models, make_bench_cases()
  - unused deps (jsonlines, scipy, websockets, httpx-maybe-TestClient), redis service in compose
  - unreferenced images (dda-chart.gif, dda-live.svg, gh-project-cover.jpg) + README missing live-run.png
  - DLP "email" destination substring-matches email_assistant
  - session_smuggling threshold ">" vs IntentVerifier ">="
  - build_loop drops agents >2; random domain vs task mismatch
  - dashboard blocked-node yellow styling unreachable (visual redesign)

gotchas:
  - B01/B03 change simulated numbers by design; results/*.md were from live run, unaffected
  - B10 changes generator output; tests reading v1 file unaffected
  - B11 ValueError on bad --defense is a behavior change but surfaces a real misuse

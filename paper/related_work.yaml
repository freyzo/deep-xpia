# Related-work positioning matrix for the deep-xpia paper.
# Facts were read from each paper's arXiv abstract page or HTML on the `accessed` date;
# "not checked" marks details not verified. Recheck titles/authors/versions at submission.
matrix_version: 1
accessed: 2026-10-11
fields: [id, ref, url, measures, topology_or_depth, outcome_measure, models, overlap, difference, cite_for]

entries:
  # ---- multi-agent injection and delegation (closest work)
  - id: kill_chain_canaries
    ref: "Wang, Zhang. Kill-Chain Canaries: Stage-Level Tracking of Prompt Injection Across Attack Surfaces and Five Production LLMs. arXiv:2603.28013 (v4, 2026-09-30)"
    url: https://arxiv.org/abs/2603.28013
    measures: "950 tests; a unique canary per payload; furthest stage reached (Exposed, Persisted, Relayed, Executed); 6 attack surfaces, 5 defense conditions"
    topology_or_depth: "relay between agents through shared memory and tool results; depth not varied"
    outcome_measure: canary-based stage tracking
    models: "five production LLMs incl. Claude Haiku 4.5, Claude Sonnet 4.5, GPT-4o-mini, DeepSeek Chat (fifth not checked)"
    overlap: tracking an injection across agents with canaries
    difference: "no delegation-depth manipulation, no confused-deputy taxonomy"
    cite_for: "canary/stage outcome measurement (our P1); Haiku/Sonnet 4.5 executed 0 of 164 text-surface attacks vs GPT-4o-mini 53%"
  - id: masdrift
    ref: "Xu et al. MasDrift: Benchmarking Authorization Preservation Across Multi-Agent Architectures. arXiv:2608.07556 (v2, 2026-08-11)"
    url: https://arxiv.org/abs/2608.07556
    measures: "600 benign tasks with reserved actions; single-agent vs centralized vs decentralized coordination"
    topology_or_depth: "yes: hierarchy depth and peer width varied"
    outcome_measure: task completion + unauthorized actions (authorization preservation)
    models: not checked
    overlap: delegation depth as an experimental variable; scope preservation across hops
    difference: "benign tasks, no injection; measures authorization drift, not injection detection"
    cite_for: "unauthorized actions 2.7-19.8% in centralized hierarchies vs 0.6-0.8% in peer networks, gap widening with depth; re-anchoring each call to the user request helps"
  - id: operational_reframing
    ref: "Liu et al. Operational Reframing and Approval-Framed Delegation in Multi-Agent LLM Safety. arXiv:2607.07097 (2026-07-08)"
    url: https://arxiv.org/abs/2607.07097
    measures: "five-condition controlled contrast separating reframing, planner behaviour and approval-framed delegation; 30 synthetic harmful scenarios + exploratory external set"
    topology_or_depth: "planner -> executor; depth not varied"
    outcome_measure: compliance judged by an LLM
    models: "GPT, Gemini, DeepSeek and Claude families (versions not checked)"
    overlap: effect of the delegation channel on downstream agents
    difference: "harmful-request compliance, not cross-prompt injection"
    cite_for: "controlled-contrast design (our P2.5, H3); approval framing raises executor compliance (Gemini 8.9% -> 38.9% with a Claude planner)"
  - id: delegated_misalignment
    ref: "Ying et al. Delegated Misalignment: How Multi-Agent Structures Amplify LLM Safety Risks. arXiv:2609.27900 (2026-08-26)"
    url: https://arxiv.org/abs/2609.27900
    measures: "6 frontier LLMs, 49 hazardous tasks, three-condition protocol (single agent vs principal vs subordinate)"
    topology_or_depth: "principal -> subordinate; chain length not varied in the abstract"
    outcome_measure: end-to-end full-execution rate
    models: "6 frontier LLMs incl. GPT-5, DeepSeek-V3.2"
    overlap: delegation amplifies risk
    difference: harmful tasks rather than injected content
    cite_for: "delegation raises full execution (GPT-5 22.5% -> 61.2%; DeepSeek-V3.2 30.6% -> 77.6%); single-layer defenses fail alone"
  - id: esc_cr
    ref: "Xu et al. Policy-Backed Selective Regeneration under Tainted Inter-Agent Communication. arXiv:2609.26072 (2026-08-02)"
    url: https://arxiv.org/abs/2609.26072
    measures: "ESC-CR defense: executable semantic commitments, release-boundary enforcement, clean-room regeneration; adaptive attacks"
    topology_or_depth: several communication topologies (details not checked)
    outcome_measure: unauthorized releases at matched compute
    models: several model families (not checked)
    overlap: taint on inter-agent messages
    difference: "a defense, evaluated on code generation"
    cite_for: "provenance-based alternative to our keyword 'taint' flag; retrying with polluted context fails to remove unauthorized influence"
  - id: prompt_infection
    ref: "Lee, Tiwari. Prompt Infection: LLM-to-LLM Prompt Injection within Multi-Agent Systems. arXiv:2410.07283 (2024)"
    url: https://arxiv.org/abs/2410.07283
    measures: self-replicating injection spreading across connected agents; LLM Tagging defense
    topology_or_depth: propagation across agents (structure details not checked)
    outcome_measure: not checked
    models: not checked
    overlap: injection propagation between agents
    difference: "self-replication; no confused-deputy taxonomy or detection-by-depth analysis"
    cite_for: foundational multi-agent propagation result; LLM Tagging as a defense
  - id: agent_in_the_middle
    ref: "He et al. Red-Teaming LLM Multi-Agent Systems via Communication Attacks. arXiv:2502.14847; Findings of ACL 2025"
    url: https://arxiv.org/abs/2502.14847
    measures: Agent-in-the-Middle (AiTM) interception and rewriting of inter-agent messages by an LLM adversary
    topology_or_depth: several communication structures and frameworks
    outcome_measure: not checked
    models: not checked
    overlap: the inter-agent channel as attack surface
    difference: attacker controls the channel instead of planting content upstream
    cite_for: communication-channel threat model
  - id: netsafe
    ref: "Yu et al. NetSafe: Exploring the Topological Safety of Multi-agent Networks. arXiv:2410.15686 (2024)"
    url: https://arxiv.org/abs/2410.15686
    measures: "safety of network topologies under misinformation, bias and harmful-information attacks (RelCom)"
    topology_or_depth: "yes: connectivity and distance from the attacker"
    outcome_measure: task/safety performance
    models: not checked
    overlap: topology shapes how attacks spread
    difference: "misinformation spread, not injection or exfiltration"
    cite_for: "highly connected networks are more fragile; greater distance from the attacker improves safety"
  - id: g_safeguard
    ref: "Wang et al. G-Safeguard: A Topology-Guided Security Lens and Treatment on LLM-based Multi-agent Systems. arXiv:2502.11127; ACL 2025"
    url: https://arxiv.org/abs/2502.11127
    measures: GNN anomaly detection on the multi-agent utterance graph plus topological intervention
    topology_or_depth: graph-aware
    outcome_measure: recovered task performance under attack
    models: several LLM backbones (not checked)
    overlap: detection inside multi-agent systems
    difference: graph-level defense rather than a benchmark
    cite_for: "topology-aware detection baseline (recovers over 40% of performance under prompt injection)"
  - id: aciarena
    ref: "ACIArena: Unified Evaluation for Agent Cascading Injection. arXiv:2604.07775 (2026)"
    url: https://arxiv.org/abs/2604.07775
    measures: "1,356 test cases, 6 multi-agent implementations, 3 objectives"
    topology_or_depth: multiple MAS implementations
    outcome_measure: not checked
    models: not checked
    overlap: cascading injection across agents
    difference: "no delegation-specific taxonomy or confused-deputy focus; Limitations: robustness-oriented system design not explored"
    cite_for: closest benchmark; scale reference
  - id: sentinelagent
    ref: "SentinelAgent. arXiv:2604.02767 (2026)"
    url: https://arxiv.org/abs/2604.02767
    measures: "delegation properties P1-P7; DelegationBench v4 (516 scenarios)"
    topology_or_depth: "chain depth defined (Def. 2); robustness tests to depth 32 (latency, not detection)"
    outcome_measure: property enforcement
    models: not checked
    overlap: formal delegation properties
    difference: "no detection-by-depth results; no registry-metadata property"
    cite_for: "property numbering used in taxonomy.yaml; adversarial intent paraphrasing limitation (Sec. VII-D)"
  - id: mas_hijacking_2503_12188
    ref: "Triedman, Jha, Shmatikov. Multi-Agent Systems Execute Arbitrary Malicious Code. arXiv:2503.12188 (2025)"
    url: https://arxiv.org/abs/2503.12188
    measures: hijacking multi-agent orchestration into executing attacker code
    topology_or_depth: "AutoGen (Magentic-One, Selector, Round-Robin), CrewAI, MetaGPT; depth not varied"
    outcome_measure: attack success (execution)
    models: "GPT-4o, GPT-4o-mini, Gemini 1.5 Pro, Gemini 1.5 Flash"
    overlap: content laundered through front-line agents reaches the orchestrator
    difference: "does not test detection by depth"
    cite_for: "laundering changes a request's presentation (Sec. 4) -> DXPIA-006; control-flow hijacking -> DXPIA-004"


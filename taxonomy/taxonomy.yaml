# deep-xpia attack taxonomy
# version: 2.0.0
# stable IDs: DXPIA-001 through DXPIA-008

taxonomy_version: "2.0.0"
project: deep-xpia
owasp_reference: "OWASP Top 10 for Agentic Applications 2026 (published 2025-12-09); owasp_agentic lists primary first"
sentinelagent_reference:
  source: "SentinelAgent, arXiv:2604.02767, Sec. III-B (P1-P5) and III-C (P6-P7)"
  url: https://arxiv.org/abs/2604.02767
  accessed: 2026-10-11
  properties:
    P1: authority_monotonic_narrowing
    P2: intent_entailment_preservation
    P3: policy_conjunction_preservation
    P4: forensic_reconstructibility
    P5: bounded_cascade_containment
    P6: scope_action_conformance
    P7: output_schema_conformance
  note: >
    Until 2026-10-11 this file used P3 for forensic reconstructibility, P4 for
    cascade containment and a P5 "tool_integrity" property the paper does not
    define; the v2 dataset carries those ids (errata:
    results/reanalysis/v2_property_errata.md).
depth_definition: >
  depth = number of agent-to-agent delegation edges traversed
  (topology.hop_count); the user -> first agent step is not counted.
  depth_range values below use this definition. The v2 live harness executed
  every topology as a sequential chain of len(agents) - 1 calls, so analyses
  of those runs use executed calls (results/reanalysis/dda_v2_corrected_depth.md).

attacks:
  - id: DXPIA-001
    name: session_smuggling
    title: "Session Smuggling"
    description: |
      Delegatee returns clean output plus a hidden action instruction.
      Delegator trusts the output and forwards the action to a third agent.
      The injection rides inside a legitimate response.
    hop_mechanism: instruction_piggyback
    hop_mechanism_detail: |
      Injection is appended to a legitimate delegation response and crosses
      the hop boundary as "part of the answer". No abnormal channel needed.
    depth_range: [2, 3]
    depth_detail: "inject at hop 1, execute at hop 2-3"
    attack_surface: inter_agent_message
    owasp_agentic: [ASI07, ASI02]
    owasp_detail:
      ASI07: insecure inter-agent communication (instruction rides a delegation response)
      ASI02: tool misuse and exploitation (executor runs the smuggled tool action)
    delegation_properties_violated:
      - id: P2
        name: intent_entailment_preservation
        detail: "Response semantics diverge from delegated intent"
    confused_deputies: 2
    innocent_deputies: 1
    confused_deputy_roles:
      - "data source agent: has data access, produces action instruction"
      - "intermediary agent: trusts data agent output, forwards action"
      - "executor agent: receives authorized-looking request (innocent deputy)"
    reference_scenario: src/deep_xpia/scenarios/session_smuggling/
    sources:
      - "[unit42-session-smuggling-2025] Unit 42 (Lu, Chen), When AI Agents Go Rogue: Agent Session Smuggling Attack in A2A Systems (2025-10-31); the session_smuggling scenario follows its hidden stock-trade PoC"
      - "[csa-okta-delegation-2026] secondary: CSA/Okta, Control the chain, secure the system (2026-03-25), summarizes the Unit 42 PoC"
    example_pipeline: "user -> financial_assistant -> research_agent -> trade_executor"

  - id: DXPIA-002
    name: cross_agent_memory_poisoning
    title: "Cross-Agent Memory Poisoning"
    description: |
      Agent A writes attacker-controlled data to shared memory.
      Agent B reads it in a later session and acts on poisoned data.
      The injection persists across session boundaries.
    hop_mechanism: temporal_persistence
    hop_mechanism_detail: |
      Injection is stored in shared state and crosses the hop boundary when
      a future agent reads it. Temporal depth: injection survives session
      boundaries, not just agent boundaries.
    depth_range: [2, 99]
    depth_detail: "inject in session 1, execute in session N (unbounded)"
    v2_note: "v2 benchmark cases have no shared-memory component; the mechanic exists only in the scripted memory_poisoning scenario"
    attack_surface: shared_state_memory
    owasp_agentic: [ASI06]
    owasp_detail:
      ASI06: memory & context poisoning (shared store contains attacker data)
    delegation_properties_violated:
      - id: P6
        name: scope_action_conformance
        detail: "Actions taken based on poisoned memory violate original scope"
        fit_note: "proposal, pending review: P6 covers calls outside the tool manifest; poisoned memory usually drives in-manifest calls, so P2 may fit better"
    confused_deputies: 2
    reference_scenario: src/deep_xpia/scenarios/memory_poisoning/
    sources:
      - "[rehberger-gemini-memory-2025] Rehberger, Hacking Gemini's Memory with Prompt Injection and Delayed Tool Invocation (Embrace The Red, 2025-02-10)"
    example_pipeline: "user -> email_assistant -> [shared memory] -> calendar_agent -> action_agent"

  - id: DXPIA-003
    name: tool_chain_cascade
    title: "Tool Chain Cascade"
    description: |
      Injection enters at hop 1, executes at hop 2, exfiltrates at hop 3.
      No single agent acts outside its permissions in isolation.
      The vulnerability is the chain itself.
    hop_mechanism: data_flow_cascade
    hop_mechanism_detail: |
      Injection flows through the normal delegation data path. Each hop adds
      capability the injection exploits at the next hop. The attack only exists
      across the full chain -- no individual hop is sufficient.
    depth_range: [3, 5]
    depth_detail: "inject -> execute -> exfiltrate (minimum 3 hops)"
    attack_surface: external_input_plus_inter_agent
    owasp_agentic: [ASI08, ASI02]
    owasp_detail:
      ASI08: cascading failures (harm only emerges across the chain)
      ASI02: tool misuse and exploitation (tools are the execution surface)
    delegation_properties_violated:
      - id: P1
        name: authority_monotonic_narrowing
        detail: "Chain as a whole has more authority than any individual hop"
        fit_note: "proposal, pending review: the cascade aspect may also map to P5 (bounded cascade containment)"
    confused_deputies: 3
    reference_scenario: null  # no dedicated scenario; src/deep_xpia/scenarios/intent_laundering/ (DXPIA-006) also traverses a 3-hop cascade
    sources:
      - "[invariant-whatsapp-mcp-2025] Invariant Labs, WhatsApp MCP Exploited: cross-server tool poisoning exfiltrates message history (2025-04-07)"
    example_pipeline: "user -> orchestrator -> code_review_agent -> deploy_agent -> notification_agent"

  - id: DXPIA-004
    name: delegation_chain_rerouting
    title: "Delegation Chain Re-routing"
    description: |
      Compromised agent modifies the delegation chain itself. Tells
      orchestrator to add an attacker-controlled agent or skip a
      security-checking agent.
    hop_mechanism: control_plane_injection
    hop_mechanism_detail: |
      Injection escapes from the data plane into the orchestration layer
      that determines which agents participate. The chain topology itself
      is the target.
    depth_range: [2, 2]
    depth_detail: "inject at agent, re-route at orchestrator (2 hops)"
    attack_surface: agent_profile
    owasp_agentic: [ASI01, ASI07]
    owasp_detail:
      ASI01: agent goal hijack (orchestration goal/topology redirected)
      ASI07: insecure inter-agent communication (re-route arrives as an agent message)
    delegation_properties_violated:
      - id: P5
        name: bounded_cascade_containment
        detail: "Injection modifies which agents are in the cascade"
    confused_deputies: 1
    sources:
      - "[arXiv:2503.12188] Triedman, Jha, Shmatikov (2025): adversarial content hijacks multi-agent orchestration"
    example_pipeline: "user -> orchestrator (re-routed) -> attacker_agent"

  - id: DXPIA-005
    name: scope_escalation_via_delegation
    title: "Scope Escalation via Delegation"
    description: |
      Agent A has permissions {read}. It delegates to agent B with permissions
      {read, write}. Agent A includes an instruction causing B to use its
      write permission on A's behalf. A has effectively escalated its scope.
    hop_mechanism: privilege_differential
    hop_mechanism_detail: |
      Injection exploits the permission difference between delegator and
      delegatee. The delegatee's higher privilege is leveraged by the
      delegator through a crafted instruction.
    depth_range: [2, 2]
    depth_detail: "low-priv agent -> high-priv agent (2 hops)"
    attack_surface: inter_agent_message
    owasp_agentic: [ASI03]
    owasp_detail:
      ASI03: identity and privilege abuse (delegator borrows delegatee privilege)
    delegation_properties_violated:
      - id: P1
        name: authority_monotonic_narrowing
        detail: "Delegator effectively gains authority it does not hold"
    confused_deputies: 1
    sources:
      - "[rehberger-cross-agent-privesc-2025] Rehberger, Cross-Agent Privilege Escalation: When Agents Free Each Other (Embrace The Red, 2025-09-24); there one coding agent rewrites another's config files, a related but different mechanism"
    example_pipeline: "user -> read_only_agent -> write_capable_agent (exploited)"

  - id: DXPIA-006
    name: intent_laundering
    title: "Intent Laundering"
    description: |
      Intermediate agent reformats a malicious instruction to strip detection
      markers and make it look like legitimate output. Downstream agents see
      clean-looking input.
    hop_mechanism: adversarial_refinement
    hop_mechanism_detail: |
      The intermediate agent launders the injection by rephrasing it as natural
      output, so a detector at the next hop can miss what it would catch at the
      entry hop. This is a per-case mechanism: the v2 live run showed no
      population-level decay of detection with depth.
    depth_range: [3, 99]
    depth_detail: "inject -> launder -> execute (minimum 3 hops)"
    attack_surface: inter_agent_message
    owasp_agentic: [ASI01, ASI07]
    owasp_detail:
      ASI01: agent goal hijack (downstream agents act on the attacker's goal)
      ASI07: insecure inter-agent communication (payload rewritten in agent messages)
    delegation_properties_violated:
      - id: P2
        name: intent_entailment_preservation
        detail: "Laundered instruction passes semantic similarity checks"
    confused_deputies: 2
    key_finding: |
      Per case, detection at hop 2 can be harder than at hop 1 (the scenario's
      laundered text carries no detector keywords). In the v2 live run this did
      not produce population-level decay: detection did not fall with depth
      (results/depth_analysis.md, results/reanalysis/). Related: arXiv:2503.12188
      (Sec. 4) reports that laundering a request through another agent
      "significantly changes its presentation".
    reference_scenario: src/deep_xpia/scenarios/intent_laundering/
    sources:
      - "[arXiv:2503.12188] Sec. 4: laundering a request through another agent changes its presentation"
    example_pipeline: "user -> orchestrator -> code_review_agent -> deploy_agent -> notification_agent"

  - id: DXPIA-007
    name: delayed_delegation_trigger
    title: "Delayed Delegation Trigger"
    description: |
      Injection enters agent A but doesn't activate until a specific trigger
      condition is met in a future delegation (agent B says "confirmed",
      or a time condition passes).
    hop_mechanism: conditional_activation
    hop_mechanism_detail: |
      Injection crosses the hop boundary in dormant form and activates only
      when a trigger condition is met at a later hop. The trigger may be
      semantic (a keyword), temporal (a time), or contextual (a state).
    depth_range: [2, 99]
    depth_detail: "2+ hops, time-delayed; unbounded temporal distance"
    v2_note: "v2 benchmark cases carry no trigger (no template uses {trigger}); the mechanic is not exercised"
    attack_surface: external_input_plus_temporal
    owasp_agentic: [ASI06, ASI01]
    owasp_detail:
      ASI06: memory & context poisoning (dormant injection as poisoned future state)
      ASI01: agent goal hijack (trigger later redirects an agent's goal)
    delegation_properties_violated:
      - id: P4
        name: forensic_reconstructibility
        detail: "Dormant injection is hard to attribute to original source"
    confused_deputies: 2
    sources:
      - "[rehberger-gemini-memory-2025] same post: delayed tool invocation fires when the user later says a trigger word"
    example_pipeline: "user -> agent_A (dormant injection stored) -> agent_B (trigger fires)"

  - id: DXPIA-008
    name: registry_injection
    title: "Registry Injection (Trust Boundary Sideload)"
    description: |
      Injection enters at the tool discovery/selection layer - MCP server
      manifests, plugin metadata, tool description fields - before any
      user prompt is processed. The agent is compromised at registration
      time, upstream of the entire delegation chain.
    hop_mechanism: trust_boundary_sideload
    hop_mechanism_detail: |
      Injection lives in tool metadata (MCP description fields, plugin
      manifest headers, capability declarations). Agent reads it during
      tool selection, not task execution. Bypasses prompt-stream defenses
      because the injection is in infrastructure the agent trusts implicitly.
    depth_range: [1, 3]
    depth_detail: "inject at registration/discovery, execute at first tool use"
    attack_surface: tool_registry_metadata
    owasp_agentic: [ASI04, ASI01]
    owasp_detail:
      ASI04: agentic supply chain vulnerabilities (malicious tool enters via registry)
      ASI01: agent goal hijack (tool description redirects the agent)
    delegation_properties_violated: []
    sentinelagent_note: >
      No direct counterpart in SentinelAgent P1-P7: P6 checks that each call
      appears in the agent's tool manifest, not whether the manifest content is
      trustworthy. The gap DXPIA-008 measures: tool metadata is trusted without
      content verification.
    confused_deputies: 1
    innocent_deputies: 1
    confused_deputy_roles:
      - "tool selection agent: reads the manifest, trusts metadata implicitly"
      - "task agent: uses the poisoned tool, executes injection from the description field (innocent deputy)"
    reference_scenario: src/deep_xpia/scenarios/registry_injection/
    sources:
      - "[invariant-tool-poisoning-2025] Invariant Labs, MCP Security Notification: Tool Poisoning Attacks (2025-04-01)"
      - "[arXiv:2508.14925] MCPTox: tool poisoning benchmark on real-world MCP servers"
    example_pipeline: "user -> registry_lookup -> tool_selection_agent -> task_agent"
